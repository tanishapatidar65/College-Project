<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project - TeamConnect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            TeamConnect
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <span>|</span>
            <a href="projects.html">Projects</a>
            <span>|</span>
            <a href="profile.html">Profile</a>
            <span>|</span>
            <a href="login.html">Login</a>
            <span>|</span>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <!-- Create Project Section -->
    <section class="create-project-section">

        <div class="create-project-container">

            <h1>Create Your Project</h1>

            <p class="create-project-intro">
                Add your project details and find the right team members.
            </p>

            <form>

                <label for="project-title">Project Title</label>
                <input
                    type="text"
                    id="project-title"
                    placeholder="Enter project title"
                >

                <label for="category">Project Category</label>
                <select id="category">
                    <option value="">Select category</option>
                    <option>Web Development</option>
                    <option>App Development</option>
                    <option>Software Development</option>
                    <option>College Project</option>
                    <option>Other</option>
                </select>

                <label for="description">Project Description</label>
                <textarea
                    id="description"
                    rows="5"
                    placeholder="Describe your project"
                ></textarea>

                <label for="skills">Required Skills</label>
                <input
                    type="text"
                    id="skills"
                    placeholder="Example: HTML, CSS, JavaScript"
                >

                <label for="members">Team Members Required</label>
                <input
                    type="number"
                    id="members"
                    min="1"
                    placeholder="Enter number of members"
                >

                <label for="budget">Budget</label>
                <input
                    type="number"
                    id="budget"
                    placeholder="Enter budget"
                >

                <label for="deadline">Deadline</label>
                <input
                    type="date"
                    id="deadline"
                >

                <label for="project-type">Project Type</label>
                <select id="project-type">
                    <option value="">Select project type</option>
                    <option>College Project</option>
                    <option>Personal Project</option>
                    <option>Client Project</option>
                    <option>Other</option>
                </select>

                <button type="submit">
                    Create Project
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <div class="footer-content">

            <div class="footer-info">
                <h2>TeamConnect</h2>
                <p>Project Team Formation & Collaboration System</p>
            </div>

            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="profile.html">Profile</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>

        </div>

    </footer>

</body>
</html>
